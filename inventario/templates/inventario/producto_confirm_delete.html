{% extends 'inventario/base.html' %}

{% block title %}Eliminar Producto{% endblock %}

{% block content %}
<div class="delete-confirm">
    <h1>⚠️ Confirmar Eliminación</h1>
    
    <p>¿Estás seguro de que deseas eliminar el producto <strong>"{{ producto.nombre }}"</strong>?</p>
    <p>Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'detalle_producto' producto.pk %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

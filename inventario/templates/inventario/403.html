{% extends 'inventario/base.html' %}

{% block title %}Acceso Denegado{% endblock %}

{% block content %}
<div class="alert alert-error" style="text-align: center; padding: 50px;">
    <h1>🚫 Acceso Denegado</h1>
    <p style="font-size: 1.2rem; margin-top: 20px;">
        No tiene permisos para esta opción.
    </p>
    <p style="color: #7f8c8d; margin-top: 10px;">
        Si cree que es un error, contacte al administrador del sistema.
    </p>
    <a href="{% url 'inventario:index' %}" class="btn btn-primary" style="margin-top: 20px;">
        Volver al Inicio
    </a>
</div>
{% endblock %}
